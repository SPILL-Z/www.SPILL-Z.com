backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "News Articles"
    files:
      - file: "script.js"
        label: "Manage News Data"
        name: "news_data"
        fields:
          - { label: "News List", name: "newsData", widget: "list", fields: [
              { label: "ID", name: "id", widget: "number" },
              { label: "Title", name: "title", widget: "string" },
              { label: "Category", name: "category", widget: "select", options: ["Technology", "Social & Lifestyle", "Health & Wellness", "Entertainment", "Education"] },
              { label: "Date", name: "date", widget: "string" },
              { label: "Image URL / Upload", name: "image", widget: "image" },
              { label: "Summary", name: "summary", widget: "text" },
              { label: "Full Content (HTML)", name: "content", widget: "markdown" }
            ]}
