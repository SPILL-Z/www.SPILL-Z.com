een hospitality and content creation continues to blur, cementing the neighborhood cafe as a crucial anchor of youth culture in Bangkok.</p>"

            document.getElementById('news-content').innerHTML = newsData[newsId].text;
            document.title = `${newsData[newsId].title} - SPILL-Z NEWS`;
        }
    </script>
</body>
